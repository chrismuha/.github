name: Shared commit email

on:
  workflow_call:
    inputs:
      mail_from:
        required: true
        type: string
      mail_to:
        required: true
        type: string
    secrets:
      GMAIL_APP_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Send push summary through Gmail
        env:
          GH_TOKEN: ${{ github.token }}
          MAIL_FROM: ${{ inputs.mail_from }}
          MAIL_TO: ${{ inputs.mail_to }}
          MAIL_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        shell: python
        run: |
          """Send an accessible HTML and plain-text push summary without checking out or executing repository code."""
          import json
          from html import escape
          import os
          import smtplib
          import ssl
          import time
          from urllib.request import Request, urlopen
          from urllib.parse import quote, urlsplit
          from urllib.error import HTTPError, URLError
          from email.message import EmailMessage
          from email.utils import getaddresses
          from pathlib import Path


          def load_commit_files(commit_id, env):
              """GitHub Actions omits file arrays, so read the commit API without checkout."""
              files = []
              for page in range(1, 31):
                  url = (env.get('GITHUB_API_URL', 'https://api.github.com')
                         + '/repos/' + quote(env['GITHUB_REPOSITORY'], safe='/')
                         + '/commits/' + quote(commit_id, safe='')
                         + f'?per_page=100&page={page}')
                  request = Request(url, headers={
                      'Authorization': 'Bearer ' + env['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  })
                  with urlopen(request, timeout=20) as response:
                      batch = json.load(response).get('files', [])
                  files.extend(batch)
                  if len(batch) < 100:
                      break
              return files


          def add_file_details(event, env):
              for commit in event.get('commits', [])[:100]:
                  try:
                      commit['file_details'] = load_commit_files(commit['id'], env)
                      if len(commit['file_details']) >= 3000:
                          commit['file_note'] = 'GitHub limits this list to 3,000 files; see the commit link for more.'
                  except (HTTPError, URLError, TimeoutError, KeyError, ValueError, OSError):
                      commit['file_note'] = 'File list unavailable from GitHub; use the commit link to view changes.'


          def html_link(url, label):
              url = str(url)
              parsed = urlsplit(url)
              if parsed.scheme != 'https' or not parsed.netloc:
                  return escape(label)
              return (f'<a href="{escape(url, quote=True)}" '
                      'style="color:#0645ad;text-decoration:underline;overflow-wrap:anywhere;'
                      f'word-break:break-word;">{escape(label)}</a>')


          def build_message(event, env):
              sender = env['MAIL_FROM']
              recipients = [address for _, address in getaddresses([env['MAIL_TO']])]
              if not recipients or any('\n' in x or '\r' in x for x in [sender, env['MAIL_TO']]):
                  raise ValueError('Invalid notification addresses')
              repo = env['GITHUB_REPOSITORY']
              ref = event.get('ref', env.get('GITHUB_REF', 'manual test'))
              actor = event.get('sender', {}).get('login', env.get('GITHUB_ACTOR', 'unknown'))
              commits = event.get('commits', [])
              subject = f'[{repo}] {len(commits)} commit(s) pushed to {ref}'
              if env.get('GITHUB_EVENT_NAME') == 'workflow_dispatch':
                  subject = f'[{repo}] Commit email test'
              message = EmailMessage()
              message['From'] = sender
              message['To'] = ', '.join(recipients)
              message['Subject'] = ' '.join(subject.splitlines())
              html = ['<!doctype html><html lang="en"><head><meta charset="utf-8">'
                      '<meta name="viewport" content="width=device-width, initial-scale=1">'
                      '<title>Commit notification</title></head>'
                      '<body style="margin:0;padding:24px;background:#ffffff;color:#17212b;'
                      'font-family:Arial,Helvetica,sans-serif;font-size:22px;line-height:1.6;'
                      'overflow-wrap:anywhere;word-break:break-word;">'
                      '<main style="max-width:800px;margin:0 auto;">'
                      '<h1 style="font-size:34px;line-height:1.3;margin:0 0 24px;">Commit update</h1>',
                      f'<p><strong>Repository:</strong> {escape(repo)}<br>'
                      f'<strong>Branch or tag:</strong> {escape(ref)}<br>'
                      f'<strong>Pushed by:</strong> {escape(actor)}</p>']
              lines = [f'Repository: {repo}', f'Ref: {ref}', f'Pushed by: {actor}', '']
              for commit in commits[:100]:
                  author = commit.get('author', {}).get('name', 'unknown')
                  lines.extend([f"{commit.get('id', '')[:12]} - {author}",
                                commit.get('message', ''), commit.get('url', ''), ''])
                  title = commit.get('message', '').splitlines()
                  heading = title[0] if title else 'Commit details'
                  html.extend(['<section style="border-top:2px solid #bac4ce;padding-top:20px;margin-top:28px;">',
                               f'<h2 style="font-size:28px;line-height:1.35;margin:0 0 16px;">{escape(heading)}</h2>',
                               f'<p><strong>Commit:</strong> {escape(commit.get("id", "")[:12])}<br>'
                               f'<strong>Author:</strong> {escape(author)}</p>',
                               '<p style="white-space:pre-wrap;">' + escape(commit.get('message', '')) + '</p>',
                               '<p>' + html_link(commit.get('url', ''), 'View this commit on GitHub') + '</p>'])
                  groups = {'Added / New files': [], 'Modified files': [], 'Deleted files': []}
                  for file in commit.get('file_details', []):
                      status = file.get('status')
                      name = file['filename']
                      if status == 'renamed':
                          name = file.get('previous_filename', name) + ' -> ' + name + ' (renamed)'
                      group = ('Added / New files' if status in ('added', 'copied') else
                               'Deleted files' if status == 'removed' else 'Modified files')
                      groups[group].append(name)
                  for title, names in groups.items():
                      if names:
                          html.append(f'<h3 style="font-size:25px;line-height:1.4;margin:24px 0 12px;">{escape(title)}</h3><ul style="padding-left:28px;">')
                          html.extend('<li style="margin:0 0 14px;"><strong>' + escape(name) + '</strong></li>' for name in names)
                          html.append('</ul>')
                          lines.append(title + ':')
                          lines.extend('  - ' + name for name in names)
                          lines.append('')
                  if commit.get('file_note'):
                      lines.extend([commit['file_note'], ''])
                      html.append('<p>' + escape(commit['file_note']) + '</p>')
                  html.append('</section>')
              if len(commits) > 100:
                  lines.append('Showing the first 100 commits; see the comparison for the full push.')
                  html.append('<p>Showing the first 100 commits; see the comparison for the full push.</p>')
              if event.get('compare'):
                  lines.append('Compare: ' + event['compare'])
                  html.append('<p>' + html_link(event['compare'], 'Compare all changes in this push') + '</p>')
              lines.append(f"Run: {env.get('GITHUB_SERVER_URL', 'https://github.com')}/{repo}/actions/runs/{env['GITHUB_RUN_ID']}")
              html.append('<p>' + html_link(f"{env.get('GITHUB_SERVER_URL', 'https://github.com')}/{repo}/actions/runs/{env['GITHUB_RUN_ID']}", 'View the GitHub Actions run') + '</p></main></body></html>')
              message.set_content('\n'.join(lines))
              message.add_alternative('\n'.join(html), subtype='html')
              return message


          def send_message(message, env):
              """Retry only connection/authentication disconnects, never message submission."""
              for attempt in range(3):
                  smtp = None
                  try:
                      if attempt < 2:
                          smtp = smtplib.SMTP_SSL('smtp.gmail.com', 465, timeout=30,
                                                  context=ssl.create_default_context())
                      else:
                          smtp = smtplib.SMTP('smtp.gmail.com', 587, timeout=30)
                          smtp.ehlo()
                          smtp.starttls(context=ssl.create_default_context())
                          smtp.ehlo()
                      # Use challenge/response after a dropped initial-response login.
                      smtp.login(env['MAIL_FROM'], env['MAIL_PASSWORD'],
                                 initial_response_ok=(attempt == 0))
                  except (smtplib.SMTPServerDisconnected, TimeoutError, ConnectionError):
                      if smtp is not None:
                          smtp.close()
                      if attempt == 2:
                          raise RuntimeError('Gmail disconnected before message submission after 3 attempts; '
                                             'check Google account security and SMTP access. No message was submitted.') from None
                      print(f'Gmail disconnected before submission; reconnecting (attempt {attempt + 2}/3).')
                      time.sleep(15 * (attempt + 1))
                      continue
                  except BaseException:
                      if smtp is not None:
                          smtp.close()
                      raise
                  try:
                      # A disconnect here has uncertain delivery: retrying could duplicate mail.
                      smtp.send_message(message)
                  finally:
                      smtp.close()
                  return


          def main():
              env = os.environ
              for name in ['MAIL_FROM', 'MAIL_TO', 'MAIL_PASSWORD']:
                  if not env.get(name):
                      raise RuntimeError(f'Missing required secret: {name}')
              event = json.loads(Path(env['GITHUB_EVENT_PATH']).read_text())
              if env.get('GITHUB_EVENT_NAME') == 'push':
                  add_file_details(event, env)
              message = build_message(event, env)
              send_message(message, env)
              print('Commit notification accepted by Gmail SMTP.')


          if __name__ == '__main__':
              main()
